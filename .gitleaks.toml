# Default gitleaks configuration (template)
# Docs: https://github.com/gitleaks/gitleaks

title = "default-gitleaks-config"

[extend]
useDefault = true

# Global allowlist for known-safe patterns (extend per repo as needed)
[allowlist]
description = "Global allowlist"
regexes = [
  '''EXAMPLE_.*''',
  '''your-api-key-here''',
  '''changeme''',
  '''placeholder''',
]
paths = [
  '''(?i)\.env\.example$''',
  '''(?i)\.env\.sample$''',
  '''(?i)\.env\.template$''',
  '''(?i)testdata/''',
  '''(?i)fixtures/''',
  '''(?i)mocks/''',
]

